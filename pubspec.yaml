name: victory_stars
description: "Victory Stars: a personal growth app for recording the moments you got through."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  adaptive_icon_background: "#0D1220"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground_adaptive_ring.png"
  web:
    generate: true
    background_color: "#0D1220"
    theme_color: "#0D1220"
